[project]
name = "advanta-airbnb"
version = "0.1.0"
description = "European Airbnb accommodation analytics challenge"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "altair>=5.5,<7",
    "joblib>=1.4,<2",
    "marimo>=0.19,<1",
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<4",
    "pyarrow>=18",
    "scikit-learn>=1.6,<2",
    "scipy>=1.14,<2",
    "seaborn>=0.13,<1",
    "vl-convert-python>=1.9.0.post1",
]

[project.optional-dependencies]
slides = ["python-pptx>=1.0,<2"]

[dependency-groups]
dev = [
    "pre-commit>=4,<5",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airbnb_analytics"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["E501", "B018"]
